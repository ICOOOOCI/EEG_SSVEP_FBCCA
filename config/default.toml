# 运行配置模板。命令行参数优先级高于此文件；未填写字段使用代码默认值。

[session]
deepseek_model = "deepseek-chat"
deepseek_api_url = "https://api.deepseek.com/chat/completions"
deepseek_api_key_env = "DEEPSEEK_API_KEY"
deepseek_timeout_s = 60.0
# 系统提示词默认值见 config.py（面向 ALS/BCI 用户）；如需替换可在此填写单行字符串：
# deepseek_system_prompt = "..."
# 主菜单、模式1、模式2的滑动窗口。窗长改变后分数范围会变，分数和分差阈值要一起调整。
window_s = 2.5
decode_step_s = 0.25
score_ema = 1.0
selection_hold_windows = 4
# 模式3（34键）使用更长的窗口和自己的阈值。
chat_window_s = 3.5
chat_score_ema = 0.5
chat_hold_windows = 2
chat_min_score = 0.40
chat_min_margin = 0.10
chair_confirm_settle_s = 0.45
chair_confirm_timeout_s = 7.0
chair_watchdog_s = 1.0
response_delay_s = 0.23
record_root = "session_records"

[acquisition]
eeg_stream_name = "obci_eeg1"
eeg_stream_type = "EEG"
timestamp_mode = "lsl"
channel_indices = [0, 1, 2, 3, 4, 5, 6, 7]
buffer_s = 60.0
connect_timeout_s = 10.0
startup_timeout_s = 45.0
warmup_s = 10.0

[decoder]
target_fs = 250.0
n_harmonics = 3
weight_a = 1.25
weight_b = 0.25
notch_hz = 50.0
cca_regularization = 1e-10

[rejection]
# Offline sweep of the 2026-10-19 session with idle false selections limited to 1/min (one
# session, one person). The alpha limit is from the 5 s calibration. Mode 3 uses chat_min_*.
rejection_enabled = true
rejection_min_score = 0.40
rejection_min_margin = 0.10
rejection_max_alpha_ratio = 2.7631716193293068
rejection_calibration_id = "offline_20261019_sliding_window_sweep"

[chatbox]
# 模式三无障碍：朗读回复与语音提示、语速(-10..10)、语音确认所选键、
# 所选键高亮时长、读完回复后停留多久再恢复闪烁输入。
chatbox_voice_enabled = true
chatbox_voice_rate = -1
chatbox_speak_selections = true
chatbox_feedback_s = 0.6
chatbox_reading_chars_per_s = 14.0
chatbox_reply_hold_s = 3.0
# 输入法式单词预测：字母页顶部 3 个候选词键；DeepSeek 上下文预测；每轮前最多等待秒数。
# 关闭 chatbox_predictions_enabled 可恢复为 31 个目标（不含候选键）。
chatbox_predictions_enabled = true
chatbox_llm_predictions = true
chatbox_prediction_wait_s = 1.0
# 不打算输入时的保护：用 [rejection] 阈值拦截"没在看键盘"的轮次（不输入任何字符）。
chatbox_rejection_enabled = true

[display]
# true：全屏（默认）。false：可拖动缩放、可最大化的窗口，键盘随窗口大小重新排布（闪烁进行中不重排）。
# 也可用启动参数 --fullscreen / --windowed 临时切换。
full_screen = true
screen_index = 0
window_size = [1280, 800]
viewing_distance_cm = 70.0

