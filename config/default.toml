# 运行配置模板。命令行参数优先级高于此文件；未填写字段使用代码默认值。

[session]
deepseek_model = "deepseek-chat"
deepseek_api_url = "https://api.deepseek.com/chat/completions"
deepseek_api_key_env = "DEEPSEEK_API_KEY"
deepseek_timeout_s = 60.0
# 系统提示词默认值见 config.py（面向 ALS/BCI 用户）；如需替换可在此填写单行字符串：
# deepseek_system_prompt = "..."
# 保留2026-10-21末提交675db9a的FBCCA参数，分析窗按当前要求统一为5秒。
window_s = 5.0
decode_step_s = 0.25
score_ema = 1.0
# 每个有效窗口直接选中，不做连续窗口计数。
# 模式3两页均使用5秒分析窗，不叠加跨窗平滑。
chat_window_s = 5.0
chat_number_window_s = 5.0
chat_score_ema = 1.0
chat_min_score = 0.25934562367893293
# 第一/第二名分差门槛：分差不足时继续闪烁、等下一个滑动窗口，而不是直接选中。
chat_min_margin = 0.05
# 每轮闪烁开始后忽略的秒数，留给用户把视线移到下一个键。
chat_gaze_shift_s = 1.0
# 按频率的分数归一化（由 2026-11-03 模式3采集生成）。文件可用且解码参数一致时，
# 模式3按 z 分数选键：最高 z >= chat_norm_min_z 且领先第二名 >= chat_norm_min_margin。
# 换电极位置或新采集后，用 python -m ssvep_fbcca.score_norm 重新生成。
chat_score_norm_file = "config/chat_score_norm_P01.json"
chat_norm_min_z = 4.0
chat_norm_min_margin = 0.5
chair_confirm_settle_s = 0.45
chair_confirm_timeout_s = 7.0
chair_watchdog_s = 1.0
response_delay_s = 0.23
record_root = "session_records"

[acquisition]
eeg_stream_name = "obci_eeg1"
eeg_stream_type = "EEG"
timestamp_mode = "lsl"
channel_indices = [0, 1, 2, 3, 4, 5, 6, 7]
buffer_s = 60.0
connect_timeout_s = 10.0
startup_timeout_s = 45.0
warmup_s = 10.0

[decoder]
target_fs = 250.0
n_harmonics = 3
# 各界面均恢复3次谐波、原五子带和原权重。
menu_n_harmonics = 3
chair_n_harmonics = 3
chat_n_harmonics = 3
chat_weight_a = 1.25
chat_weight_b = 0.25
chat_cca_regularization = 1e-10
chat_letter_filter_bands_hz = [[6.0, 90.0], [14.0, 90.0], [22.0, 90.0], [30.0, 90.0], [38.0, 90.0]]
chat_number_filter_bands_hz = [[6.0, 90.0], [14.0, 90.0], [22.0, 90.0], [30.0, 90.0], [38.0, 90.0]]
weight_a = 1.25
weight_b = 0.25
notch_hz = 50.0
cca_regularization = 1e-10
# 可选：自定义 FBCCA 子带；省略时仍用原来的五子带。
# 谐波数可调整，但所有候选频率的最高参考谐波必须低于处理采样率的 Nyquist。
# 以下只是参数格式示例，未经独立验证不得当成优化结论：
# fbcca_filter_bands_hz = [[6.0, 48.0], [14.0, 48.0], [22.0, 48.0]]

[rejection]
# 恢复2026-10-21启动配置中的拒识阈值；未在当前UI上重新标定。
rejection_enabled = true
rejection_min_score = 0.25934562367893293
rejection_min_margin = 0.0
rejection_max_alpha_ratio = 2.7631716193293068
rejection_calibration_id = "offline_20261019_target12_screen_around_eyes"

[chatbox]
# 模式三无障碍：朗读回复与语音提示、语速(-10..10)、语音确认所选键、
# 所选键高亮时长、读完回复后停留多久再恢复闪烁输入。
chatbox_voice_enabled = true
chatbox_voice_rate = -1
chatbox_speak_selections = true
chatbox_feedback_s = 0.6
chatbox_reading_chars_per_s = 14.0
chatbox_reply_hold_s = 3.0
# 输入法式单词预测：字母页顶部 3 个候选词键；DeepSeek 上下文预测；每轮前最多等待秒数。
# 关闭 chatbox_predictions_enabled 可恢复为 31 个目标（不含候选键）。
chatbox_predictions_enabled = true
chatbox_llm_predictions = true
chatbox_prediction_wait_s = 1.0
# 不打算输入时的保护：用 [rejection] 阈值拦截"没在看键盘"的轮次（不输入任何字符）。
chatbox_rejection_enabled = true

[display]
# true：全屏（默认）。false：可拖动缩放、可最大化的窗口，键盘随窗口大小重新排布（闪烁进行中不重排）。
# 也可用启动参数 --fullscreen / --windowed 临时切换。
full_screen = true
screen_index = 0
window_size = [1280, 800]
viewing_distance_cm = 70.0
screen_diagonal_inches = 13.0
# 可配置的设计起点；空间不足时按同一比例缩小，并把实际角度写入显示元数据。
stimulus_size_deg = 4.0
stimulus_center_pitch_deg = 6.0

