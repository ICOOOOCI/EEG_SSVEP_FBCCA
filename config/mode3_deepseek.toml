# Mode 3 (DeepSeek ChatBox) configuration.
# The API key is stored in ~/.config/ssvep_fbcca/deepseek.json by the setup command.

[session]
session_mode = "chatbox"
deepseek_model = "deepseek-chat"
deepseek_api_url = "https://api.deepseek.com/chat/completions"
deepseek_api_key_env = "DEEPSEEK_API_KEY"
deepseek_timeout_s = 60.0
# 可选：取消下一行注释并填写系统提示词。
# deepseek_system_prompt = "你是一个简洁、可靠的中文助手。"
protocol = "standard_5s"
blocks = 3
random_seed = 20260928
cue_s = 2.0
response_delay_s = 0.23
record_root = "session_records"

[acquisition]
eeg_stream_name = "obci_eeg1"
eeg_stream_type = "EEG"
timestamp_mode = "lsl"
channel_indices = [0, 1, 2, 3, 4, 5, 6, 7]
buffer_s = 60.0
connect_timeout_s = 10.0
startup_timeout_s = 45.0
warmup_s = 10.0

[decoder]
target_fs = 250.0
n_harmonics = 3
filter_bank_profile = "m3_5band"
weight_a = 1.25
weight_b = 0.25
notch_hz = 50.0
notch_mode = "epoch"
cca_regularization = 1e-10

[rejection]
rejection_enabled = true
rejection_min_score = 0.25934562367893293
rejection_min_margin = 0.0
rejection_max_alpha_ratio = 2.7631716193293068
rejection_calibration_id = "offline_20261019_target12_screen_around_eyes"

[display]
full_screen = true
screen_index = 0
window_size = [1920, 1080]
viewing_distance_cm = 70.0
